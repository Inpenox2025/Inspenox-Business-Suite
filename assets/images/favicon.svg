<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Navy Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091226" />
      <stop offset="50%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#03060d" />
    </linearGradient>

    <!-- Glowing Inspenox Brand Azure Blue Gradient -->
    <linearGradient id="inspenoxBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b8ff" />
      <stop offset="45%" stop-color="#008ce3" />
      <stop offset="100%" stop-color="#0066d0" />
    </linearGradient>

    <!-- Center Ambient Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#008ce3" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#008ce3" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#008ce3" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Border Delicate Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 184, 255, 0.55)" />
      <stop offset="50%" stop-color="rgba(0, 140, 227, 0.20)" />
      <stop offset="100%" stop-color="rgba(0, 102, 208, 0.45)" />
    </linearGradient>

    <!-- Drop Shadow / Neon Aura -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#008ce3" flood-opacity="0.50" />
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#00b8ff" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle App Badge -->
  <rect x="22" y="22" width="468" height="468" rx="116" ry="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Center Ambient Glow -->
  <circle cx="256" cy="245" r="200" fill="url(#centerGlow)" />

  <!-- Inspenox "İ" Emblem -->
  <g filter="url(#softGlow)">
    <!-- Top Hollow Ring: Center (256, 132), R_outer=58, R_inner=32, stroke-width=26 -->
    <circle cx="256" cy="132" r="45" fill="none" stroke="url(#inspenoxBlue)" stroke-width="26" />

    <!-- Connecting Vertical Neck Stem -->
    <rect x="243" y="178" width="26" height="44" fill="url(#inspenoxBlue)" />

    <!-- Main Solid Pillar -->
    <rect x="216" y="216" width="80" height="208" rx="4" ry="4" fill="url(#inspenoxBlue)" />
  </g>
</svg>
